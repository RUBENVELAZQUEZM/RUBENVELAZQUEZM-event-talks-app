<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery Release Notes Tracker</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/google-cloud.png">
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Application Header -->
        <header>
            <div class="logo-group">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <!-- Google Cloud style database/bigquery icon -->
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
                        <path d="M12 8v8M8 12h8" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>BigQuery Release Hub</h1>
                    <p>Track, filter, and share Google BigQuery updates</p>
                </div>
            </div>
            
            <div class="header-actions">
                <div class="sync-status">
                    <span class="sync-label">Feed Status</span>
                    <span id="sync-time" class="sync-time">Loading...</span>
                </div>
                <button id="btn-refresh" class="btn-refresh" title="Force Refresh Feed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Search and Category Filters -->
        <section class="filter-section">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search updates by keyword (e.g. Gemini, partition, performance)...">
            </div>
            
            <div class="filter-categories">
                <span class="filter-label">Filter:</span>
                <button class="filter-pill active" data-type="all">All</button>
                <button class="filter-pill" data-type="feature">Features</button>
                <button class="filter-pill" data-type="announcement">Announcements</button>
                <button class="filter-pill" data-type="issue">Issues</button>
                <button class="filter-pill" data-type="deprecation">Deprecations</button>
                <button class="filter-pill" data-type="update">Other Updates</button>
            </div>
        </section>

        <!-- Timeline Release Feed -->
        <main id="timeline" class="timeline">
            <!-- Timeline elements dynamically generated by app.js -->
        </main>
    </div>

    <!-- Twitter Composer Modal -->
    <div id="tweet-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Share on Twitter / X</h3>
                <button id="btn-close-modal" class="btn-close">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="twitter-post-ui">
                    <div class="user-avatar">BQ</div>
                    <div class="composer-area">
                        <div class="composer-user-info">
                            <span class="composer-name">BigQuery Tracker</span>
                            <span class="composer-handle">@bq_updates</span>
                        </div>
                        <textarea id="tweet-textarea" class="tweet-textarea" placeholder="What's happening?"></textarea>
                    </div>
                </div>
                
                <!-- Quick Toggle Customizations -->
                <div class="composer-options">
                    <label id="toggle-link-label" class="toggle-option">
                        <input type="checkbox" id="toggle-link" checked>
                        <span>Include original link</span>
                    </label>
                    <label class="toggle-option">
                        <input type="checkbox" id="toggle-hash" checked>
                        <span>Add #BigQuery hashtag</span>
                    </label>
                </div>
            </div>
            
            <div class="modal-footer">
                <div class="character-count-box">
                    <svg width="24" height="24" class="progress-ring">
                        <circle stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="transparent" r="9" cx="12" cy="12"/>
                        <circle id="char-progress-ring" stroke-width="2" fill="transparent" r="9" cx="12" cy="12" class="progress-ring-circle" stroke-dasharray="56.54" stroke-dashoffset="56.54"/>
                    </svg>
                    <span id="char-count-num" class="character-count">0 / 280</span>
                </div>
                <button id="btn-post-tweet" class="btn-tweet">
                    <svg viewBox="0 0 24 24">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    Post to X
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Main JavaScript App -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
